<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PEPE Miner | PAID PLUS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

  :root {
    --green: #22c55e;
    --green-bright: #4ade80;
    --green-neon: #00ff88;
    --green-dark: #166534;
    --bg-deep: #030806;
    --bg-mid: #071410;
    --card: rgba(34,197,94,0.03);
    --border: rgba(34,197,94,0.2);
    --text: #d1fae5;
    --text-dim: #6b9e7a;
    --gold: #fbbf24;
    --red: #ef4444;
  }

  html, body { width: 100%; min-height: 100vh; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: 
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34,197,94,0.12), transparent),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(0,255,136,0.06), transparent),
      linear-gradient(180deg, #06120e 0%, #030806 100%);
    color: var(--text);
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(1px 1px at 20% 30%, rgba(0,255,136,0.5), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(34,197,94,0.4), transparent),
      radial-gradient(1px 1px at 80% 15%, rgba(0,255,136,0.6), transparent),
      radial-gradient(1px 1px at 40% 90%, rgba(34,197,94,0.4), transparent),
      radial-gradient(1.5px 1.5px at 10% 60%, rgba(0,255,136,0.5), transparent),
      radial-gradient(1.5px 1.5px at 90% 40%, rgba(34,197,94,0.4), transparent);
    background-size: 100% 100%;
    animation: twinkle 4s infinite;
    pointer-events: none;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 0.3; }
  }

  .header {
    width: 100%;
    max-width: 440px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: linear-gradient(135deg, rgba(34,197,94,0.1), rgba(34,197,94,0.02));
    border: 1px solid rgba(34,197,94,0.25);
    border-radius: 20px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(12px);
  }

  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(0,255,136,0.15), transparent);
    animation: shine 4s infinite;
  }

  @keyframes shine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .logo-text {
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #ffffff, #4ade80, #22c55e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    position: relative;
    z-index: 2;
  }

  .back-btn {
    color: var(--green-bright);
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    padding: 8px 15px;
    background: rgba(34,197,94,0.15);
    border-radius: 20px;
    border: 1px solid rgba(34,197,94,0.3);
    transition: 0.3s;
    position: relative;
    z-index: 2;
    letter-spacing: 0.5px;
  }

  .back-btn:active { transform: scale(0.94); }

  .main-card {
    width: 100%;
    max-width: 440px;
    background: linear-gradient(160deg, rgba(34,197,94,0.05), rgba(34,197,94,0.01));
    border: 1px solid rgba(34,197,94,0.2);
    border-radius: 28px;
    padding: 28px 24px;
    backdrop-filter: blur(24px);
    box-shadow: 
      0 25px 70px rgba(0,0,0,0.7),
      0 0 40px rgba(34,197,94,0.08),
      inset 0 1px 0 rgba(0,255,136,0.1);
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }

  .main-card::before {
    content: '';
    position: absolute;
    top: -100px; left: -100px;
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(0,255,136,0.1), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .balance-card {
    background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(34,197,94,0.03));
    border: 1px solid rgba(34,197,94,0.35);
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }

  .balance-card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,255,136,0.15), transparent);
    animation: shine 4s infinite;
  }

  .balance-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 3px;
    margin-bottom: 8px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .balance-value {
    font-family: 'Inter', monospace;
    font-size: 2.4rem;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 1px;
    text-shadow: 
      0 0 15px rgba(0,255,136,0.7),
      0 0 30px rgba(34,197,94,0.4);
    transition: transform 0.15s ease;
    line-height: 1;
  }

  .balance-value.bump { animation: bump 0.2s ease; }

  @keyframes bump {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .balance-unit {
    font-size: 0.8rem;
    color: var(--green-bright);
    letter-spacing: 3px;
    margin-top: 8px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .timer-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(34,197,94,0.06);
    border: 1px solid rgba(34,197,94,0.2);
    border-radius: 16px;
    padding: 14px 20px;
    margin-bottom: 22px;
    transition: 0.3s;
  }

  .timer-card.active {
    background: rgba(34,197,94,0.12);
    border-color: rgba(0,255,136,0.5);
    box-shadow: 0 0 25px rgba(34,197,94,0.25);
  }

  .timer-label {
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .timer-value {
    font-family: 'Inter', monospace;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--green-bright);
    letter-spacing: 3px;
    text-shadow: 0 0 15px rgba(0,255,136,0.6);
    direction: ltr;
  }

  .pepe-stage {
    position: relative;
    width: 100%;
    height: 270px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .counter {
    font-family: 'Inter', monospace;
    font-size: 2.6rem;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 1px;
    text-shadow: 
      0 0 20px rgba(0,255,136,0.8),
      0 0 40px rgba(34,197,94,0.5);
    margin-bottom: 20px;
    line-height: 1;
  }

  .pepe-wrap {
    position: relative;
    width: 190px;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(34,197,94,0.2);
    pointer-events: none;
    transition: border-color 0.4s;
  }
  .ring-1 { width: 175px; height: 175px; border-color: rgba(0,255,136,0.25); }
  .ring-2 { 
    width: 205px; height: 205px; 
    border-style: dashed; 
    border-color: rgba(34,197,94,0.15);
    animation: spin 30s linear infinite; 
  }
  .ring-3 { width: 235px; height: 235px; border-color: rgba(34,197,94,0.08); }

  @keyframes spin { to { transform: rotate(360deg); } }

  .pepe-img {
    width: 135px;
    height: 135px;
    border-radius: 50%;
    cursor: pointer;
    object-fit: cover;
    z-index: 2;
    background: #ffffff;
    padding: 12px;
    box-shadow:
      0 0 0 3px rgba(0,255,136,0.5),
      0 0 40px rgba(34,197,94,0.6),
      0 0 80px rgba(0,255,136,0.3);
    transition: box-shadow 0.3s, filter 0.3s, transform 0.3s;
  }

  .pepe-img:hover { 
    filter: brightness(1.1);
    transform: scale(1.03);
  }

  .pepe-img:active {
    transform: scale(0.95);
  }

  .pepe-img.burst {
    animation: shake 0.15s infinite;
    box-shadow:
      0 0 0 5px rgba(0,255,136,0.9),
      0 0 70px rgba(0,255,136,1),
      0 0 120px rgba(34,197,94,0.6);
  }

  @keyframes shake {
    0%   { transform: translate(0, 0) rotate(0deg); }
    20%  { transform: translate(-3px, 2px) rotate(-2deg); }
    40%  { transform: translate(3px, -2px) rotate(2deg); }
    60%  { transform: translate(-2px, -3px) rotate(-1deg); }
    80%  { transform: translate(2px, 3px) rotate(1deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  .pepe-img.cooling {
    opacity: 0.4;
    cursor: not-allowed;
    filter: grayscale(1) brightness(0.5);
    box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
  }

  .progress-wrap {
    width: 100%;
    max-width: 270px;
    height: 4px;
    background: rgba(34,197,94,0.1);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 20px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .progress-wrap.visible { opacity: 1; }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #166534, #00ff88);
    border-radius: 10px;
    transition: width 0.1s linear;
    box-shadow: 0 0 15px rgba(0,255,136,0.9);
  }

  .status {
    font-size: 0.78rem;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-top: 16px;
    min-height: 20px;
    transition: color 0.3s;
    font-weight: 600;
    text-align: center;
    padding: 0 10px;
  }

  .status.active { color: var(--green-bright); }
  .status.burst { color: #ffffff; }
  .status.cooling { color: var(--red); }

  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
  }

  .stat-box {
    background: rgba(34,197,94,0.05);
    border: 1px solid rgba(34,197,94,0.15);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .stat-value {
    font-family: 'Inter', monospace;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--green-bright);
    letter-spacing: 1px;
  }

  .actions-bottom {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .action-btn {
    width: 100%;
    padding: 16px;
    font-size: 0.88rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    border: 1px solid rgba(34,197,94,0.35);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.3s;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
    text-decoration: none;
  }

  .action-btn svg { width: 16px; height: 16px; }

  .wallet-btn {
    background: linear-gradient(135deg, rgba(0,255,136,0.15), rgba(34,197,94,0.04));
    color: var(--green-neon);
    border-color: rgba(0,255,136,0.4);
    box-shadow: 0 0 20px rgba(34,197,94,0.15);
  }

  .wallet-btn:hover {
    background: linear-gradient(135deg, rgba(0,255,136,0.3), rgba(34,197,94,0.1));
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0,255,136,0.35);
    border-color: rgba(0,255,136,0.6);
  }

  .float-reward {
    position: fixed;
    color: var(--green-neon);
    font-family: 'Inter', monospace;
    font-weight: 800;
    font-size: 1.1rem;
    pointer-events: none;
    animation: floatUp 1.1s ease-out forwards;
    z-index: 99;
    text-shadow: 0 0 15px rgba(0,255,136,0.9);
    direction: ltr;
  }

  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
  }

  .particle {
    position: fixed;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--green-neon);
    pointer-events: none;
    box-shadow: 0 0 10px var(--green-neon);
    animation: particleFly 1s ease-out forwards;
  }

  @keyframes particleFly {
    0%   { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.2); }
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(6,18,14,0.98);
    border: 1px solid rgba(34,197,94,0.4);
    border-radius: 14px;
    padding: 14px 26px;
    color: var(--green-bright);
    font-size: 0.85rem;
    transition: transform 0.4s ease;
    z-index: 200;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(34,197,94,0.2);
    max-width: 90%;
    text-align: center;
    font-weight: 700;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: rgba(239,68,68,0.6); color: #fca5a5; }
  .toast.success { border-color: rgba(0,255,136,0.7); color: var(--green-neon); }
  .toast.warning { border-color: rgba(251,191,36,0.6); color: #fbbf24; }

  @media (max-width: 420px) {
    .counter { font-size: 2.2rem; }
    .balance-value { font-size: 1.9rem; }
    .logo-text { font-size: 1.15rem; letter-spacing: 3px; }
    .pepe-wrap { width: 170px; height: 170px; }
    .pepe-img { width: 120px; height: 120px; padding: 10px; }
    .ring-1 { width: 158px; height: 158px; }
    .ring-2 { width: 188px; height: 188px; }
    .ring-3 { width: 218px; height: 218px; }
    .balance-value { font-size: 1.9rem; }
  }
</style>
</head>
<body>

  <div class="header">
    <div class="logo-text">PEPE MINER</div>
    <a href="mining.html" class="back-btn">← BACK</a>
  </div>

  <div class="main-card">

    <div class="balance-card">
      <div class="balance-label">Total Balance</div>
      <div class="balance-value" id="balanceEl">0</div>
      <div class="balance-unit">PEPE</div>
    </div>

    <div class="timer-card" id="timerCard">
      <div class="timer-label">Cycle Remaining</div>
      <div class="timer-value" id="timerEl">--:--</div>
    </div>

    <div class="pepe-stage">
      <div class="counter" id="counter">0</div>

      <div class="pepe-wrap">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <img id="pepeImg" class="pepe-img" src="pepe.png" alt="PEPE"
             onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%2300ff88%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2248%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22%23030608%22 text-anchor=%22middle%22%3EP%3C/text%3E%3C/svg%3E'">
      </div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="status" id="statusEl">Tap to mine +40 PEPE</div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">Mining Rate</div>
        <div class="stat-value" id="rateEl">40 / 30 min</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">System Status</div>
        <div class="stat-value" id="sysStatusEl">Ready</div>
      </div>
    </div>

  </div>

  <div class="actions-bottom">

    <a href="wallet.html" class="action-btn wallet-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>
        <path d="M16 12h6v4h-6a2 2 0 1 1 0-4z"/>
      </svg>
      Open Wallet to Withdraw
    </a>

  </div>

  <div class="toast" id="toast"></div>

<script>
  /* ============================================
     CONFIG
  ============================================ */
  const STORAGE_PREFIX     = 'pepe_';
  const BURST_AMOUNT       = 40;
  const BURST_DURATION     = 10000;
  const CYCLE_REWARD       = 40;
  const CYCLE_MS           = 30 * 60 * 1000;
  const SAVE_THROTTLE_MS   = 3000;
  const CLOCK_TOLERANCE    = 60000;
  const MAX_BALANCE        = 100000000;

  /* ============================================
     SAFE STORAGE
  ============================================ */
  const S = {
    get(key, fallback = null) {
      try {
        const raw = localStorage.getItem(STORAGE_PREFIX + key);
        return raw === null ? fallback : raw;
      } catch (e) { return fallback; }
    },
    set(key, val) {
      try { localStorage.setItem(STORAGE_PREFIX + key, String(val)); return true; }
      catch (e) { return false; }
    },
    num(key, fallback = 0) {
      const v = parseFloat(S.get(key, fallback));
      return isFinite(v) ? v : fallback;
    },
    int(key, fallback = 0) {
      const v = parseInt(S.get(key, fallback), 10);
      return isFinite(v) ? v : fallback;
    },
    clearAll() {
      try {
        Object.keys(localStorage).forEach(k => {
          if (k.startsWith(STORAGE_PREFIX)) localStorage.removeItem(k);
        });
      } catch (e) {}
    }
  };

  /* ============================================
     STATE
  ============================================ */
  let balance         = S.num('balance', 0);
  let cycleStartTime  = S.int('cycleStart', 0);
  let burstStartTime  = S.int('burstStart', 0);
  let burstStartBal   = S.num('burstStartBal', 0);
  let burstActive     = S.get('burstActive', '0') === '1';
  let cycleActive     = S.get('cycleActive', '0') === '1';
  let lastSaveTime    = S.int('lastUpdate', 0);
  let burstInterval   = null;
  let lastSaveAt      = 0;
  let isRestoring     = true;

  if (!isFinite(balance) || balance < 0) balance = 0;
  if (balance > MAX_BALANCE) balance = MAX_BALANCE;

  /* ============================================
     DOM
  ============================================ */
  const balanceEl    = document.getElementById('balanceEl');
  const counterEl    = document.getElementById('counter');
  const timerEl      = document.getElementById('timerEl');
  const timerCard    = document.getElementById('timerCard');
  const pepeImg      = document.getElementById('pepeImg');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar  = document.getElementById('progressBar');
  const statusEl     = document.getElementById('statusEl');
  const rateEl       = document.getElementById('rateEl');
  const sysStatusEl  = document.getElementById('sysStatusEl');
  const toastEl      = document.getElementById('toast');

  /* ============================================
     FORMAT
  ============================================ */
  function formatNum(v) {
    if (!isFinite(v) || v < 0) v = 0;
    return Math.floor(v).toLocaleString('en-US');
  }

  function formatTime(ms) {
    if (ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  /* ============================================
     SAVE STATE
  ============================================ */
  function saveState(force = false) {
    const now = Date.now();
    if (!force && now - lastSaveAt < SAVE_THROTTLE_MS) return;
    lastSaveAt = now;

    S.set('balance',         balance);
    S.set('cycleStart',      cycleStartTime);
    S.set('cycleActive',     cycleActive ? '1' : '0');
    S.set('burstStart',      burstStartTime);
    S.set('burstStartBal',   burstStartBal);
    S.set('burstActive',     burstActive ? '1' : '0');
    S.set('lastUpdate',      now);
  }

  /* ============================================
     UI UPDATE
  ============================================ */
  function updateBalanceUI(bump = false) {
    balanceEl.textContent = formatNum(balance);
    counterEl.textContent = formatNum(balance);

    if (bump) {
      balanceEl.classList.remove('bump');
      void balanceEl.offsetWidth;
      balanceEl.classList.add('bump');
    }
  }

  /* ============================================
     TOAST / EFFECTS
  ============================================ */
  function showToast(msg, type = '', duration = 2500) {
    toastEl.textContent = msg;
    toastEl.className = 'toast';
    if (type) toastEl.classList.add(type);
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  function floatNumber(text) {
    const el = document.createElement('div');
    el.className = 'float-reward';
    el.textContent = text;
    const rect = pepeImg.getBoundingClientRect();
    el.style.left = (rect.left + rect.width / 2 - 20 + (Math.random() * 40 - 20)) + 'px';
    el.style.top  = (rect.top - 10) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }

  function spawnParticles(count = 10) {
    const rect = pepeImg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      const dist  = 70 + Math.random() * 60;
      p.style.left = cx + 'px';
      p.style.top  = cy + 'px';
      p.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
      p.style.setProperty('--ty', (Math.sin(angle) * dist) + 'px');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  /* ============================================
     SECURITY
  ============================================ */
  function detectClockTamper() {
    const now = Date.now();
    if (lastSaveTime > 0 && now < lastSaveTime - CLOCK_TOLERANCE) return true;
    return false;
  }

  /* ============================================
     BUTTON STATE
  ============================================ */
  function canClick() { return !cycleActive && !burstActive; }

  function updatePepeButton() {
    if (canClick()) {
      pepeImg.classList.remove('cooling');
      statusEl.textContent = 'Tap to mine +40 PEPE';
      statusEl.className = 'status';
    } else {
      pepeImg.classList.add('cooling');
      const remaining = Math.max(0, CYCLE_MS - (Date.now() - cycleStartTime));
      statusEl.textContent = 'Mining cycle · ' + formatTime(remaining) + ' remaining';
      statusEl.className = 'status cooling';
    }
  }

  /* ============================================
     START BURST
  ============================================ */
  function startBurst() {
    if (burstActive) return;
    if (!canClick()) { showToast('Wait for the cycle to finish'); return; }

    burstStartTime = Date.now();
    burstStartBal  = balance;
    burstActive    = true;
    cycleActive    = true;
    cycleStartTime = burstStartTime;

    saveState(true);

    pepeImg.classList.add('burst');
    progressWrap.classList.add('visible');
    statusEl.textContent = 'Fast mining...';
    statusEl.className = 'status burst';
    sysStatusEl.textContent = 'Mining';

    runBurstLoop(burstStartTime, burstStartBal);
  }

  /* ============================================
     BURST LOOP
  ============================================ */
  function runBurstLoop(startTime, startBal) {
    if (burstInterval) clearInterval(burstInterval);

    burstInterval = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const ratio   = Math.min(elapsed / BURST_DURATION, 1);
      const desired = startBal + (BURST_AMOUNT * ratio);

      if (desired > balance) {
        const diff = desired - balance;
        balance = desired;
        updateBalanceUI(true);
        if (Math.random() < 0.4) floatNumber('+' + Math.floor(diff));
      }

      progressBar.style.width = (ratio * 100) + '%';
      if (Math.random() < 0.25) spawnParticles(4);

      saveState();

      if (ratio >= 1) {
        clearInterval(burstInterval);
        burstInterval = null;
        finishBurst();
      }
    }, 50);
  }

  /* ============================================
     FINISH BURST
  ============================================ */
  function finishBurst() {
    const finalBal = burstStartBal + BURST_AMOUNT;
    if (finalBal > balance) balance = finalBal;

    burstActive = false;
    cycleActive = true;
    cycleStartTime = Date.now();

    updateBalanceUI(true);

    pepeImg.classList.remove('burst');
    progressBar.style.width = '0%';
    progressWrap.classList.remove('visible');

    timerCard.classList.add('active');
    sysStatusEl.textContent = 'Active';
    rateEl.textContent = '40 / 30 min';

    saveState(true);

    updatePepeButton();
    updateCycleTimer();
  }

  /* ============================================
     CYCLE TIMER
  ============================================ */
  function updateCycleTimer() {
    if (!cycleActive) {
      timerEl.textContent = '--:--';
      timerCard.classList.remove('active');
      return;
    }

    const now = Date.now();
    const elapsed   = now - cycleStartTime;
    const remaining = Math.max(0, CYCLE_MS - elapsed);
    timerEl.textContent = formatTime(remaining);

    if (remaining > 0) {
      statusEl.textContent = 'Mining cycle · ' + formatTime(remaining) + ' remaining';
      statusEl.className = 'status cooling';
    }

    if (remaining <= 0) {
      // ⭐ انتهت الدورة → امنح المكافأة وتوقّف
      balance = Math.min(MAX_BALANCE, balance + CYCLE_REWARD);
      updateBalanceUI(true);
      showToast('Cycle complete! +40 PEPE', 'success');

      cycleActive = false;
      cycleStartTime = 0;
      saveState(true);

      timerCard.classList.remove('active');
      pepeImg.classList.remove('cooling');
      sysStatusEl.textContent = 'Ready';
      timerEl.textContent = '--:--';
      updatePepeButton();
    }
  }

  setInterval(updateCycleTimer, 1000);

  /* ============================================
     RESUME — يستأنف بدون دورات فائتة
  ============================================ */
  function resume() {
    isRestoring = true;

    if (detectClockTamper()) {
      S.clearAll();
      location.reload();
      return;
    }

    const now = Date.now();

    /* ---- حالة burst نشط ---- */
    if (burstActive && burstStartTime > 0) {
      const elapsed = now - burstStartTime;

      if (elapsed >= BURST_DURATION) {
        const correctBal = burstStartBal + BURST_AMOUNT;
        balance = correctBal;

        burstActive = false;
        cycleActive = true;
        cycleStartTime = burstStartTime + BURST_DURATION;

        showToast('Mining completed while you were away!', 'success');

        updateBalanceUI();
        updatePepeButton();
        updateCycleTimer();
      } else {
        pepeImg.classList.add('burst');
        progressWrap.classList.add('visible');
        statusEl.textContent = 'Fast mining...';
        statusEl.className = 'status burst';

        runBurstLoop(burstStartTime, burstStartBal);
      }

      isRestoring = false;
      return;
    }

    /* ---- حالة cycle نشط ---- */
    if (cycleActive && cycleStartTime > 0) {
      const elapsed = now - cycleStartTime;

      if (elapsed >= CYCLE_MS) {
        // انتهى العدّاد أثناء الغياب → امنح مكافأة دورة واحدة فقط
        balance = Math.min(MAX_BALANCE, balance + CYCLE_REWARD);
        updateBalanceUI(true);
        showToast('Cycle complete! +40 PEPE', 'success');

        cycleActive = false;
        cycleStartTime = 0;
        saveState(true);

        timerCard.classList.remove('active');
        pepeImg.classList.remove('cooling');
        sysStatusEl.textContent = 'Ready';
        timerEl.textContent = '--:--';
        updatePepeButton();
      } else {
        updateBalanceUI();
        updatePepeButton();
        updateCycleTimer();
      }

      isRestoring = false;
      return;
    }

    /* ---- لا يوجد شيء نشط ---- */
    updateBalanceUI();
    rateEl.textContent = '40 / 30 min';
    sysStatusEl.textContent = 'Ready';
    timerEl.textContent = '--:--';
    updatePepeButton();
    isRestoring = false;
  }

  /* ============================================
     EVENTS
  ============================================ */
  pepeImg.addEventListener('click', () => {
    if (isRestoring) return;
    if (burstActive) return;
    if (!canClick()) { showToast('Wait for the cycle to finish'); return; }
    startBurst();
  });

  /* ============================================
     SAVE ON UNLOAD
  ============================================ */
  window.addEventListener('beforeunload', () => {
    saveState(true);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) saveState(true);
  });

  setInterval(() => saveState(), 4000);

  /* ============================================
     INIT
  ============================================ */
  updateBalanceUI();
  rateEl.textContent = '40 / 30 min';
  sysStatusEl.textContent = 'Ready';
  timerEl.textContent = '--:--';
  resume();
</script>

</body>
</html>
